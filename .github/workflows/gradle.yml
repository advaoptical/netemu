# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a package using Gradle and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#Publishing-using-gradle

name: Gradle

on:
  push:
    branches: [master, stefanz/actions]

  release:
    types: [created]

jobs:
  publish-sdn4j-yang:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Check sdn4j-yang sub-project properties
      run: >
        gradle sdn4j-yang:properties --info --stacktrace --warning-mode all
        --project-prop artifactoryReleaseUrl="$GITHUB_PACKAGES_URL"
        --project-prop artifactorySnapshotUrl="$GITHUB_PACKAGES_URL"

      env:
        GITHUB_PACKAGES_URL: https://maven.pkg.github.com/advaoptical/netemu

    # The USERNAME and TOKEN need to correspond to the credentials environment variables used in
    # the publishing section of your build.gradle
    - name: Publish sdn4j-yang sub-project to GitHub Packages
      run: >
        gradle sdn4j-yang:publish --info --stacktrace --warning-mode all
        --project-prop artifactoryReleaseUrl="$GITHUB_PACKAGES_URL"
        --project-prop artifactorySnapshotUrl="$GITHUB_PACKAGES_URL"
        --project-prop artifactoryUser="$GITHUB_USER"
        --project-prop artifactoryToken="$GITHUB_TOKEN"

      env:
        GITHUB_PACKAGES_URL: https://maven.pkg.github.com/advaoptical/netemu

        GITHUB_USER: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
